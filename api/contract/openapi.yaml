        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Send contact card (vCard)
      tags:
        - Messaging
  /api/sessions/{sessionId}/messages/location:
    post:
      operationId: MessagingController_sendLocation
      parameters:
        - name: sessionId
          required: true
          in: path
