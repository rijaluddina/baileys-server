openapi: 3.0.3
info:
  title: Baileys WhatsApp API
  description: |
    Production-grade WhatsApp API platform built on Baileys.
    Multi-tenant, event-driven, OpenAPI-first.

    ## Authentication
    All endpoints require `Authorization: Bearer <api-key-or-jwt>` header,
    except health check endpoints.

    ## Response Format
    All responses follow a standard envelope:
    ```json
    {
      "success": true,
      "data": { ... },
      "meta": { "requestId": "uuid", "timestamp": "ISO8601" }
    }
    ```

    ## Async Operations
    Write operations (message send, media upload) are queued via BullMQ
    and return `202 Accepted` with a `jobId`. Results arrive via
    WebSocket or Webhook.

    ## Standard Headers
    - `X-Idempotency-Key` — for write operations (request)
    - `X-Correlation-Id` — request tracing (request/response)
    - `X-Request-Id` — server-generated (response)
    - `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset` (response)
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: "{protocol}://{host}"
    description: API server
    variables:
      protocol:
        default: https
        enum: [https, http]
      host:
        default: localhost:3000
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Health check endpoints (no auth required)
  - name: Auth
    description: Authentication, API key management, JWT login/refresh
  - name: Session
    description: WhatsApp session lifecycle and data queries
  - name: Messaging
    description: Send and manage WhatsApp messages (async via BullMQ)
  - name: Chat
    description: Chat operations (archive, pin, mute, delete)
  - name: Contact
    description: Contact management and profile operations
  - name: Group
    description: WhatsApp group management
  - name: Newsletter
    description: Newsletter/Channel management (experimental)
  - name: Presence
    description: Presence status management
  - name: Privacy
    description: Privacy settings management
  - name: Label
    description: Label/tag management for chats and messages
  - name: Device
    description: Device information
  - name: Blocklist
    description: Blocked contacts management
  - name: Media
    description: Media upload and management
  - name: Webhook
    description: Webhook configuration (tenant + session scoped) and delivery management
  - name: Capability
    description: Feature capability management per session
  - name: Event
    description: Event replay and history
  - name: Admin
    description: Administrative operations — tenant provisioning, limits, DLQ, metrics (operator-level)
  - name: Community
    description: Community management (planned)
  - name: Call
    description: Call event management (planned)
  - name: Catalog
    description: Product catalog management (planned)
  - name: Business
    description: Business profile management (planned)

# ============================================================================
# PATHS
# ============================================================================
paths:
  # --------------------------------------------------------------------------
  # HEALTH
  # --------------------------------------------------------------------------
  /health/live:
    get:
      operationId: Health_liveness
      summary: Liveness probe — is process alive
      tags: [Health]
      x-stability: stable
      x-since: "2026-05-01"
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /health/ready:
    get:
      operationId: Health_readiness
      summary: Readiness probe — can process serve traffic
      tags: [Health]
      x-stability: stable
      x-since: "2026-05-01"
      security: []
      responses:
        "200":
          description: All dependencies healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: One or more dependencies unhealthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /health/startup:
    get:
      operationId: Health_startup
      summary: Startup probe — has initialization completed
      tags: [Health]
      x-stability: stable
      x-since: "2026-05-01"
      security: []
      responses:
        "200":
          description: Startup complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Still initializing

  # --------------------------------------------------------------------------
  # AUTH
  # --------------------------------------------------------------------------
  /v1/auth/keys:
    get:
      operationId: Auth_listKeys
      summary: List all API keys for current tenant
      tags: [Auth]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: API keys list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ApiKeyDto"
                      meta:
                        properties:
                          pagination:
                            $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/auth/keys/rotate/{id}:
    post:
      operationId: Auth_rotateKey
      summary: Rotate an API key
      tags: [Auth]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key rotated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/auth/keys/deactivate/{id}:
    post:
      operationId: Auth_deactivateKey
      summary: Deactivate an API key
      tags: [Auth]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/auth/keys/activate/{id}:
    post:
      operationId: Auth_activateKey
      summary: Activate an API key
      tags: [Auth]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Key activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/auth/login:
    post:
      operationId: Auth_login
      summary: Login with email and password (JWT)
      tags: [Auth]
      x-stability: stable
      x-since: "2026-05-01"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginDto"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/auth/refresh:
    post:
      operationId: Auth_refresh
      summary: Refresh access token
      tags: [Auth]
      x-stability: stable
      x-since: "2026-05-01"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenDto"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/auth/logout:
    post:
      operationId: Auth_logout
      summary: Logout — revoke refresh token
      tags: [Auth]
      x-stability: stable
      x-since: "2026-05-01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutDto"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/auth/logout-all:
    post:
      operationId: Auth_logoutAll
      summary: Revoke all refresh tokens for current user
      tags: [Auth]
      x-stability: stable
      x-since: "2026-05-01"
      responses:
        "200":
          description: All sessions revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  # --------------------------------------------------------------------------
  # TENANT (self-service — current tenant info)
  # --------------------------------------------------------------------------
  /v1/tenant/me:
    get:
      operationId: Tenant_getSelf
      summary: Get current tenant info (self-lookup via auth context)
      tags: [Admin]
      x-stability: stable
      x-since: "2026-05-01"
      responses:
        "200":
          description: Current tenant details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/TenantDto"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  # --------------------------------------------------------------------------
  # SESSION
  # --------------------------------------------------------------------------
  /v1/sessions:
    post:
      operationId: Session_create
      summary: Create a new WhatsApp session
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionDto"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"
    get:
      operationId: Session_getAll
      summary: List all sessions
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      responses:
        "200":
          description: Sessions list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}:
    get:
      operationId: Session_getStatus
      summary: Get session status
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
    delete:
      operationId: Session_delete
      summary: Delete session and remove all data
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Session deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/logout:
    post:
      operationId: Session_logout
      summary: Logout from WhatsApp and delete session
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/reconnect:
    post:
      operationId: Session_reconnect
      summary: Force reconnect session from stored auth state
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: Reconnecting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccessResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/qr:
    get:
      operationId: Session_getQR
      summary: Get current QR code for session
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: QR code data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        type: object
                        properties:
                          qr:
                            type: string
                            description: QR code as base64 data URI
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/qr/stream:
    get:
      operationId: Session_qrStream
      summary: SSE stream for QR code updates
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string

  /v1/sessions/{sessionId}/messages/{jid}:
    get:
      operationId: Session_getMessages
      summary: Get message history for a chat
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - $ref: "#/components/parameters/jid"
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
          description: Cursor for pagination
      responses:
        "200":
          description: Message history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/MessageResponse"
                      meta:
                        properties:
                          pagination:
                            $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/contacts:
    get:
      operationId: Session_getContacts
      summary: List contacts for a session
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - name: search
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Contacts list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ContactDto"
                      meta:
                        properties:
                          pagination:
                            $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/chats:
    get:
      operationId: Session_getChats
      summary: List chats for a session
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Chats list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChatDto"
                      meta:
                        properties:
                          pagination:
                            $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/webhooks/logs:
    get:
      operationId: Session_getWebhookLogs
      summary: Get webhook delivery logs for a session
      tags: [Session]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - $ref: "#/components/parameters/page"
        - $ref: "#/components/parameters/pageSize"
      responses:
        "200":
          description: Webhook logs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiSuccessResponse"
                  - properties:
                      data:
                        type: array
                        items:
                          type: object
                      meta:
                        properties:
                          pagination:
                            $ref: "#/components/schemas/PaginationMeta"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  # --------------------------------------------------------------------------
  # MESSAGING (async — all sends return 202 + jobId)
  # --------------------------------------------------------------------------
  /v1/sessions/{sessionId}/messages/text:
    post:
      operationId: Messaging_sendText
      summary: Send a text message (async)
      tags: [Messaging]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTextDto"
      responses:
        "202":
          description: Message accepted for async delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/messages/media:
    post:
      operationId: Messaging_sendMedia
      summary: Send a media message (async)
      tags: [Messaging]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMediaDto"
      responses:
        "202":
          description: Media message accepted for async delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/messages/contact:
    post:
      operationId: Messaging_sendContact
      summary: Send a contact card (async)
      tags: [Messaging]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendContactDto"
      responses:
        "202":
          description: Contact accepted for async delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/messages/location:
    post:
      operationId: Messaging_sendLocation
      summary: Send a location message (async)
      tags: [Messaging]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendLocationDto"
      responses:
        "202":
          description: Location accepted for async delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
          $ref: "#/components/responses/ServerError"

  /v1/sessions/{sessionId}/messages/poll:
    post:
      operationId: Messaging_sendPoll
      summary: Send a poll message (async)
      tags: [Messaging]
      x-stability: stable
      x-since: "2026-05-01"
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendPollDto"
      responses:
        "202":
          description: Poll accepted for async delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJobResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "500":
