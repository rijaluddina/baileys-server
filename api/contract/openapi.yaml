# ============================================================================
# COMPONENTS
# ============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "API Key or JWT token. Format: Bearer <api-key-or-jwt>"
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Legacy API key header (alias for bearerAuth)

  parameters:
    sessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
      description: WhatsApp session ID
    groupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
      description: Group JID
    jid:
      name: jid
      in: path
      required: true
      schema:
        type: string
      description: "WhatsApp JID (phone@s.whatsapp.net or group@g.us)"
    newsletterJid:
      name: newsletterJid
      in: path
      required: true
      schema:
        type: string
      description: Newsletter/Channel JID
    webhookId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Webhook ID
    page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Items per page

  headers:
    X-Request-Id:
      schema:
        type: string
        format: uuid
      description: Server-generated request ID
    X-Correlation-Id:
      schema:
        type: string
        format: uuid
      description: Request correlation ID (echoed from request)
    X-RateLimit-Limit:
      schema:
        type: integer
      description: Rate limit ceiling for the endpoint
    X-RateLimit-Remaining:
      schema:
        type: integer
      description: Remaining requests in current window
    X-RateLimit-Reset:
      schema:
        type: integer
      description: Unix timestamp when rate limit resets

  schemas:
    # --- Response Envelope ---
    ApiSuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          description: Response payload
        meta:
          type: object
          properties:
            requestId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time
            pagination:
              $ref: "#/components/schemas/PaginationMeta"

    ApiErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            details:
              type: array
              items:
                type: object
            docs:
              type: string
              description: Link to relevant documentation
        meta:
          type: object
          properties:
            requestId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time

    AsyncJobResponse:
      type: object
      description: Response for async operations queued via BullMQ
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [jobId]
          properties:
            jobId:
              type: string
              format: uuid
              description: BullMQ job ID — track via WebSocket/Webhook
        meta:
          type: object
          properties:
            requestId:
              type: string
              format: uuid
            timestamp:
              type: string
              format: date-time

    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        cursor:
          type: string
          description: Opaque cursor for cursor-based pagination
        hasMore:
          type: boolean

    ErrorCode:
      type: string
      enum:
        - AUTH_INVALID_KEY
        - AUTH_EXPIRED_TOKEN
        - AUTH_INSUFFICIENT_PERMISSIONS
        - TENANT_NOT_FOUND
        - TENANT_LIMIT_EXCEEDED
        - SESSION_NOT_FOUND
        - SESSION_NOT_CONNECTED
        - SESSION_ALREADY_EXISTS
        - SESSION_LIMIT_EXCEEDED
        - FEATURE_NOT_ENABLED
        - FEATURE_PLANNED
        - MESSAGE_SEND_FAILED
        - MESSAGE_NOT_FOUND
        - INVALID_JID
        - MEDIA_TOO_LARGE
        - MEDIA_UPLOAD_FAILED
        - RATE_LIMIT_EXCEEDED
        - VALIDATION_ERROR
        - IDEMPOTENCY_CONFLICT
        - INTERNAL_ERROR

    SessionStatusEnum:
      type: string
      enum:
        - created
        - initializing
        - qr_ready
        - pairing
        - authenticated
        - connected
        - reconnecting
        - disconnected
        - destroyed

    # --- Health ---
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok]

    ReadinessResponse:
      type: object
      properties:
        database:
          type: string
          enum: [ok, error]
        redis:
          type: string
          enum: [ok, error]
        storage:
          type: string
          enum: [ok, error]

    # --- Auth ---
    LoginDto:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token TTL in seconds

    RefreshTokenDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LogoutDto:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ApiKeyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
          description: First 8 characters of the key
        isActive:
          type: boolean
        permissions:
          type: array
          items:
            type: string
        ipWhitelist:
          type: array
          items:
            type: string
          description: Optional CIDR IP whitelist
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time

    # --- Tenant ---
    TenantDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        maxSessions:
          type: integer
        active:
          type: boolean
        settings:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateTenantDto:
      type: object
      required: [name, slug, owner]
      properties:
        name:
          type: string
        slug:
          type: string
          description: Unique URL-safe identifier
        owner:
          type: object
          required: [email, password]
          properties:
            email:
              type: string
              format: email
            password:
              type: string
              format: password
        settings:
          type: object
        limits:
          type: object

    UpdateTenantDto:
      type: object
      properties:
        name:
          type: string
        maxSessions:
          type: integer
        active:
          type: boolean
        settings:
          type: object

    # --- Session ---
    SessionResponse:
      type: object
      properties:
        sessionId:
          type: string
        name:
          type: string
          description: Human-readable session label (unique within tenant)
        status:
          $ref: "#/components/schemas/SessionStatusEnum"
        qrCode:
          type: string
        pairingCode:
          type: string
        phoneNumber:
          type: string
        userName:
          type: string
        lastActiveAt:
          type: string
          format: date-time
          readOnly: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSessionDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Human-readable session label (unique within tenant, e.g. 'main', 'support-1')
        sessionId:
          type: string
          description: Custom session ID (auto-generated UUID if omitted)
        webhookUrl:
          type: string
        pairingCode:
          type: boolean
          description: Use pairing code auth instead of QR
        phoneNumber:
          type: string
          description: Required when pairingCode is true

    # --- Messaging ---
    MessageKey:
      type: object
      required: [id, remoteJid, fromMe]
      properties:
        id:
          type: string
        remoteJid:
          type: string
        fromMe:
          type: boolean
        participant:
          type: string

    MessageResponse:
      type: object
      properties:
        id:
          type: string
        key:
          $ref: "#/components/schemas/MessageKey"
        message:
          type: object
        pushName:
          type: string
        timestamp:
          type: integer
        status:
          type: string

    SendTextDto:
      type: object
      required: [jid, text]
      properties:
        jid:
          type: string
        text:
          type: string
        quoted:
          type: string
        mentions:
          type: array
          items:
            type: string
        linkPreview:
          type: boolean

    SendMediaDto:
      type: object
      required: [jid, media, mediaType]
      properties:
        jid:
          type: string
        media:
          type: string
          description: URL or base64 encoded media
        mediaType:
          type: string
          enum: [image, video, audio, document, sticker]
        caption:
