openapi: 3.0.0
info:
  title: Baileys WhatsApp API
  description: Comprehensive REST API for WhatsApp using Baileys library. Provides session management, messaging, group administration, contacts, newsletters, and more.
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: "{protocol}://{host}"
    description: API server
    variables:
      protocol:
        default: https
        enum:
          - https
          - http
      host:
        default: localhost:3000
paths:
  /api/auth/keys:
    get:
      operationId: AuthController_listKeys
      parameters: []
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeysListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: List all API keys for current tenant
      tags:
        - Auth
  /api/auth/keys/rotate/{id}:
    post:
      operationId: AuthController_rotateKey
      parameters:
        - name: id
          required: true
          in: path
          description: API Key ID
          schema:
            type: string
      responses:
        "200":
          description: API key rotated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Rotate an API key
      tags:
        - Auth
  /api/auth/keys/deactivate/{id}:
    post:
      operationId: AuthController_deactivateKey
      parameters:
        - name: id
          required: true
          in: path
          description: API Key ID
          schema:
            type: string
      responses:
        "200":
          description: API key deactivated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Deactivate an API key
      tags:
        - Auth
  /api/auth/keys/activate/{id}:
    post:
      operationId: AuthController_activateKey
      parameters:
        - name: id
          required: true
          in: path
          description: API Key ID
          schema:
            type: string
      responses:
        "200":
          description: API key activated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Activate a deactivated API key
      tags:
        - Auth
  /api/sessions:
    post:
      operationId: SessionController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionDto"
      responses:
        "201":
          description: Session created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Create a new WhatsApp session
      tags:
        - Session
    get:
      operationId: SessionController_getAll
      parameters: []
      responses:
        "200":
          description: List of all sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: List all sessions (from database)
      tags:
        - Session
  /api/sessions/{sessionId}:
    get:
      operationId: SessionController_getStatus
      parameters:
        - name: sessionId
          required: true
          in: path
          description: Session ID
          schema:
            type: string
      responses:
        "200":
          description: Session status retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Get session status
      tags:
        - Session
    delete:
      operationId: SessionController_delete
      parameters:
        - name: sessionId
          required: true
          in: path
          description: Session ID
          schema:
            type: string
      responses:
        "200":
          description: Session deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Delete a session and remove all data
      tags:
        - Session
  /api/sessions/{sessionId}/logout:
    post:
      operationId: SessionController_logout
      parameters:
        - name: sessionId
          required: true
          in: path
          description: Session ID
          schema:
            type: string
      responses:
        "200":
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Logout from WhatsApp and delete session
      tags:
        - Session
  /api/sessions/{sessionId}/reconnect:
    post:
      operationId: SessionController_reconnect
      parameters:
        - name: sessionId
          required: true
          in: path
          description: Session ID
          schema:
            type: string
      responses:
        "200":
          description: Reconnect command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Force reconnect a session from stored auth state
      tags:
        - Session
  /api/sessions/{sessionId}/qr/stream:
    get:
      operationId: SessionController_qrStream
      parameters:
        - name: sessionId
          required: true
          in: path
          description: Session ID
          schema:
            type: string
      responses:
        "200":
          description: SSE stream for QR updates
          content:
            text/event-stream:
              schema:
                type: object
                properties:
                  qr:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Server-Sent Events for QR code updates
      tags:
        - Session
  /api/sessions/{sessionId}/messages/{jid}:
    get:
      operationId: SessionController_getMessages
      parameters:
        - name: sessionId
          required: true
          in: path
          description: Session ID
          schema:
            type: string
        - name: jid
          required: true
          in: path
          description: Chat JID
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: "Number of messages (default: 25)"
          schema:
            type: number
        - name: cursor
          required: false
          in: query
          description: Cursor for pagination (message ID)
          schema:
            type: string
      responses:
        "200":
          description: Message history retrieved from database. This endpoint uses cursor-based pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Get message history for a chat (from database)
      tags:
        - Session
  /api/sessions/{sessionId}/contacts:
    get:
      operationId: SessionController_getContacts
      parameters:
        - name: sessionId
          required: true
          in: path
          description: Session ID
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: Search by name or JID
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: "Limit (default: 50)"
          schema:
            type: number
        - name: offset
          required: false
          in: query
          description: "Offset (default: 0)"
          schema:
            type: number
      responses:
        "200":
          description: Stored contacts retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactListResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Get stored contacts (from database)
      tags:
        - Session
  /api/sessions/{sessionId}/chats:
    get:
      operationId: SessionController_getChats
      parameters:
        - name: sessionId
          required: true
          in: path
          description: Session ID
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: "Limit (default: 50)"
          schema:
            type: number
        - name: offset
          required: false
          in: query
          description: "Offset (default: 0)"
          schema:
            type: number
      responses:
