        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Get stored chats (from database)
      tags:
        - Session
  /api/sessions/{sessionId}/webhooks/logs:
    get:
      operationId: SessionController_getWebhookLogs
      parameters:
        - name: sessionId
          required: true
          in: path
          description: Session ID
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: "Limit (default: 50)"
          schema:
            type: number
        - name: offset
          required: false
          in: query
          description: "Offset (default: 0)"
          schema:
            type: number
      responses:
        "200":
          description: Webhook delivery logs retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Get webhook delivery logs (from database)
      tags:
        - Session
  /api/sessions/{sessionId}/messages/text:
    post:
      operationId: MessagingController_sendText
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
          description: Session ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTextDto"
      responses:
        "201":
          description: Message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Send a text message
      tags:
        - Messaging
  /api/sessions/{sessionId}/messages/media:
    post:
      operationId: MessagingController_sendMedia
      parameters:
        - name: sessionId
          required: true
          in: path
          schema:
            type: string
          description: Session ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMediaDto"
      responses:
        "201":
          description: Media message sent successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "500":
          $ref: "#/components/responses/ServerError"
      security:
        - x-api-key: []
      summary: Send media (image, video, audio, document, sticker)
      tags:
        - Messaging
  /api/sessions/{sessionId}/messages/contact:
