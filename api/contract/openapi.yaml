          type: string
        labelId:
          type: string
        action:
          type: string
          enum: [add, remove]

    # --- Newsletter ---
    CreateNewsletterDto:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    UpdateNewsletterNameDto:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateNewsletterDescriptionDto:
      type: object
      required: [description]
      properties:
        description:
          type: string

    NewsletterReactDto:
      type: object
      required: [key, emoji]
      properties:
        key:
          $ref: "#/components/schemas/MessageKey"
        emoji:
          type: string

    SendNewsletterMessageDto:
      type: object
      required: [content]
      properties:
        content:
          type: string
        media:
          type: string
        mediaType:
          type: string
          enum: [text, image, video]

    # --- Webhook ---
    WebhookDto:
      type: object
      required: [name, url]
      properties:
        id:
          type: string
          readOnly: true
        tenantId:
          type: string
          readOnly: true
          description: Owning tenant (always set)
        sessionId:
          type: string
          readOnly: true
          description: "Scoping session — null for tenant-wide webhooks"
        name:
          type: string
        url:
          type: string
          format: uri
        secret:
          type: string
          description: HMAC-SHA256 signing secret
        events:
          type: array
          items:
            type: string
          default: []
          description: Event type filter (empty = all events)
        sessionIds:
          type: array
          items:
            type: string
          description: "Filter events to specific sessions (tenant-level webhooks only, empty = all sessions)"
        headers:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: Custom HTTP headers for webhook delivery
        active:
          type: boolean
          default: true
        maxRetries:
          type: integer
          default: 3
          description: Maximum delivery retry attempts
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true

    # --- Media ---
    InitUploadDto:
      type: object
      required: [fileName, fileSize, mimeType]
      properties:
        fileName:
          type: string
        fileSize:
          type: integer
        mimeType:
          type: string
        duration:
          type: integer
        width:
          type: integer
        height:
          type: integer

    # --- Capability ---
    CapabilityDto:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        stability:
          type: string
          enum: [stable, beta, experimental, planned, deprecated]
        dependencies:
          type: array
          items:
            type: string
        default:
          type: boolean
        configurable:
          type: boolean

    CapabilityUpdateDto:
      type: object
      description: Map of capability names to enabled/disabled status
      properties:
        capabilities:
          type: object
          additionalProperties:
            type: boolean

    # --- Admin ---
    DLQEntryDto:
      type: object
      properties:
        id:
          type: string
        originalQueue:
          type: string
        jobData:
          type: object
        failedAttempts:
          type: integer
        lastError:
          type: string
        failedAt:
          type: string
          format: date-time
        action:
          type: string
          enum: [retry, discard, manual]

    SessionRateLimitOverride:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
        minDelayBetweenMessagesMs:
          type: integer
        burstLimit:
          type: integer
        sustainedLimit:
          type: integer
        preset:
          type: string
          enum: [personal, business, conservative, aggressive]

    GlobalLimitsDto:
      type: object
      properties:
        maxSessions:
          type: integer
        maxConcurrentJobs:
          type: integer
        maxWebhooks:
          type: integer
        maxWebsocketConnections:
          type: integer
        maxMediaUploadSizeMb:
          type: integer
        rateLimits:
          type: object
          properties:
            global:
              type: object
              properties:
                max:
                  type: integer
                windowSec:
                  type: integer
            perEndpoint:
              type: object
              additionalProperties:
                type: object
                properties:
                  max:
                    type: integer
                  windowSec:
                    type: integer
              description: "Per-endpoint rate limits, keyed by endpoint pattern (e.g. 'POST /v1/sessions/:id/messages')"
            perSession:
              type: object
              properties:
                max:
                  type: integer
                windowSec:
                  type: integer

    CircuitBreakerStatusDto:
      type: object
      properties:
        workerId:
          type: string
        status:
          type: string
          enum: [closed, open, half-open]
        failures:
          type: integer
        lastFailureAt:
          type: string
          format: date-time
        lastSuccessAt:
          type: string
          format: date-time

  responses:
    BadRequestError:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    UnauthorizedError:
      description: Unauthorized — invalid or missing credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ForbiddenError:
      description: Forbidden — insufficient permissions or capability not enabled
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    RateLimitError:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait before retrying
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorResponse"
