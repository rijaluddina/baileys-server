components:
  securitySchemes:
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
  responses:
    BadRequestError:
      description: Bad request / Invalid input parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BadRequestError"
    UnauthorizedError:
      description: Unauthorized / Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UnauthorizedError"
    NotFoundError:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotFoundError"
    ValidationError:
      description: Validation failed for request body/parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    ServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ServerError"
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties: {}
    MessageKey:
      type: object
      properties:
        id:
          type: string
          description: Unique message ID
        remoteJid:
          type: string
          description: JID of the chat/contact/group
        fromMe:
          type: boolean
          description: Was this message sent by the current session user
        participant:
          type: string
          description: Sender JID (for group chats)
      required:
        - id
        - remoteJid
        - fromMe
    ApiKeyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        keyPrefix:
          type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        expiresAt:
          type: string
    KeysListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ApiKeyDto"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    MessageHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/MessageResponse"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ContactDto:
      type: object
      properties:
        jid:
          type: string
        name:
          type: string
        notify:
          type: string
        verifiedName:
          type: string
        imgUrl:
          type: string
    ContactListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ContactDto"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ChatDto:
      type: object
      properties:
        jid:
          type: string
        name:
          type: string
        unreadCount:
          type: integer
        lastMessageTimestamp:
          type: integer
    ChatListResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: array
          items:
            $ref: "#/components/schemas/ChatDto"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    SessionResponse:
      type: object
      properties:
        sessionId:
          type: string
        status:
          type: string
        qrCode:
          type: string
        pairingCode:
          type: string
        phoneNumber:
          type: string
    MessageResponse:
      type: object
      properties:
        id:
          type: string
        key:
          $ref: "#/components/schemas/MessageKey"
        message:
          type: object
        pushName:
          type: string
        timestamp:
          type: integer
        status:
          type: string
        error:
          type: string
    BadRequestError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
          example: 400
      required:
        - error
        - message
    UnauthorizedError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
          example: 401
      required:
        - error
        - message
    NotFoundError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
          example: 404
      required:
        - error
        - message
    ValidationError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
          example: 422
      required:
        - error
        - message
    ServerError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        statusCode:
          type: integer
          example: 500
      required:
        - error
        - message
    PrivacySettingDto:
      type: object
      properties:
        value:
          type: string
          enum:
            - all
            - contacts
            - nobody
          description: Privacy setting value
      required:
        - value
    UpdateNewsletterNameDto:
      type: object
      properties:
        name:
          type: string
          description: New newsletter name
      required:
        - name
    UpdateNewsletterDescriptionDto:
      type: object
      properties:
        description:
          type: string
          description: New newsletter description
      required:
        - description
    NewsletterReactDto:
      type: object
      properties:
        key:
          $ref: "#/components/schemas/MessageKey"
        emoji:
          type: string
          description: Reaction emoji
      required:
        - key
        - emoji
    SendTextDto:
      type: object
      properties:
        jid:
          type: string
          description: Recipient JID
        text:
          type: string
          description: Message text
        quoted:
          type: object
          description: Quoted message key
        mentions:
          type: array
          items:
            type: string
        linkPreview:
          type: boolean
          default: false
      required:
        - jid
        - text
    SendMediaDto:
      type: object
      properties:
        jid:
          type: string
          description: Recipient JID
        media:
          type: string
          description: Media URL or base64
        mediaType:
          type: string
          enum:
            - image
            - video
            - audio
            - document
            - sticker
        caption:
          type: string
        quoted:
          type: object
        mentions:
          type: array
          items:
            type: string
      required:
        - jid
        - media
        - mediaType
    SendContactDto:
      type: object
      properties:
        jid:
          type: string
          description: Recipient JID
        contactJid:
          type: string
          description: Contact JID to send
      required:
        - jid
        - contactJid
    SendLocationDto:
      type: object
      properties:
        jid:
          type: string
          description: Recipient JID
        latitude:
          type: number
        longitude:
          type: number
        title:
          type: string
        preview:
          type: string
      required:
        - jid
        - latitude
        - longitude
    SendPollDto:
      type: object
      properties:
        jid:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            type: string
        multiSelect:
          type: boolean
          default: false
        quoted:
          type: object
      required:
        - jid
        - question
        - options
    SendButtonsDto:
      type: object
      properties:
        jid:
          type: string
        text:
          type: string
        buttons:
          type: array
          items:
            type: object
            properties:
              buttonId:
                type: string
              buttonText:
                type: string
              type:
                type: string
        quoted:
          type: object
      required:
        - jid
        - text
        - buttons
    SendListDto:
      type: object
      properties:
        jid:
          type: string
        title:
          type: string
        text:
          type: string
        buttonText:
          type: string
        sections:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              rows:
                type: array
                items:
                  type: object
                  properties:
                    title:
                      type: string
                    description:
                      type: string
                    rowId:
                      type: string
      required:
        - jid
        - title
        - text
        - buttonText
        - sections
    SendReactionDto:
      type: object
      properties:
        jid:
          type: string
        key:
          $ref: "#/components/schemas/MessageKey"
        emoji:
          type: string
      required:
        - jid
        - key
        - emoji
    EditMessageDto:
      type: object
      properties:
        jid:
          type: string
        key:
          $ref: "#/components/schemas/MessageKey"
        text:
          type: string
      required:
        - jid
        - key
        - text
    DeleteMessageDto:
      type: object
      properties:
        jid:
          type: string
        key:
          $ref: "#/components/schemas/MessageKey"
        everyone:
          type: boolean
          default: false
      required:
        - jid
        - key
    ForwardMessageDto:
      type: object
      properties:
        jid:
          type: string
        key:
          $ref: "#/components/schemas/MessageKey"
        targetJid:
          type: string
      required:
        - jid
        - key
        - targetJid
    ReadMessagesDto:
      type: object
      properties:
        jid:
          type: string
        keys:
          type: array
          items:
            $ref: "#/components/schemas/MessageKey"
      required:
        - jid
        - keys
    StarMessageDto:
      type: object
      properties:
        jid:
          type: string
        keys:
          type: array
          items:
            $ref: "#/components/schemas/MessageKey"
        star:
